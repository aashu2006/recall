# Free Supabase projects pause after a week without activity. One small read a day keeps
# the database (and the dashboard) up through judging.
name: Supabase keepalive

on:
  schedule:
    - cron: "30 3 * * *" # 09:00 IST
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Select one client
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          curl --fail --silent --show-error --retry 3 --retry-delay 10 \
            -H "apikey: $SUPABASE_SERVICE_KEY" \
            "${SUPABASE_URL%/}/rest/v1/clients?select=id&limit=1" > /dev/null
          echo "Supabase responded"
